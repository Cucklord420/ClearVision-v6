image: node:24.22.3-bookworm-slim@sha256:dc26ae92c9fb15cf6b1d63e20f0944b2efe0f115b20e00be48fb23fceb061c54

variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

before_script:
  - npm ci --prefer-offline --omit=optional

stages:
  - deploy

pages:
  stage: deploy
  script:
    - npm test
    - npm run build
  artifacts:
    name: '$CI_JOB_STAGE-$CI_COMMIT_REF_NAME'
    paths:
      - public
  only:
    - master
    - triggers
    - schedules
    - web
